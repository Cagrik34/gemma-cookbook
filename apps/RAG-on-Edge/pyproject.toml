[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runedge"
version = "0.1.0"
description = "End to end RAG application on edge using Qdrant Edge and LiteRT"
requires-python = ">=3.11"
dependencies = [
    "edgeparse==0.2.5",
    "huggingface-hub==1.19.0",
    "litert-lm-api==0.18.0",
    "psutil==7.1.3",
    "qdrant-edge-py==0.7.2",
    "streamlit==1.58.0",
]

[project.scripts]
runedge-download-model = "download_models:main"
runedge-index = "index:main"

[tool.setuptools]
py-modules = [
    "app",
    "download_models",
    "index",
    "quiet_native",
]